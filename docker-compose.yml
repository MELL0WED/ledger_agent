version: '3.8'

services:
  # Relational Database Service (System of Record)
  postgres_db:
    image: postgres:15-alpine
    container_name: ledger_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: enterprise_erp
    ports:
      - "5433:5432" # FIXED: Bypasses native local Windows conflicts by shifting the host interface
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_erp"]
      interval: 5s
      timeout: 5s
      retries: 5


  # In-Memory Cache Service (Semantic Caching Layer)
  redis_cache:
    image: redis:7-alpine
    container_name: ledger_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Vector Database Service (Knowledge Base / Compliance Index)
  # Vector Database Service (Knowledge Base / Compliance Index)
  # Vector Database Service (Knowledge Base / Compliance Index)
  qdrant_db:
    image: qdrant/qdrant:v1.12.0 # UPGRADED: Connects smoothly with modern client SDK query methods
    container_name: ledger_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/health"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
  redis_data:
  qdrant_data:
